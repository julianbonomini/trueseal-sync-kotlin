name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Download artifacts & run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Fetch pre-built .so + Kotlin bindings from trueseal-sync release ──

      - name: Download trueseal-sync Android artifacts
        env:
          TRUESEAL_READ_TOKEN: ${{ secrets.TRUESEAL_READ_TOKEN }}
        run: |
          RELEASE_JSON=$(curl -sf \
            -H "Authorization: token $TRUESEAL_READ_TOKEN" \
            "https://api.github.com/repos/julianbonomini/trueseal-sync/releases/latest")

          UPSTREAM_VERSION=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          ASSET_URL=$(echo "$RELEASE_JSON" | jq -r \
            '.assets[] | select(.name | (startswith("trueseal-sync-android-") and endswith(".zip"))) | .url')

          echo "Fetching upstream $UPSTREAM_VERSION → $ASSET_URL"
          echo "UPSTREAM_VERSION=$UPSTREAM_VERSION" >> "$GITHUB_ENV"

          curl -sf -L \
            -H "Authorization: token $TRUESEAL_READ_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$ASSET_URL" -o trueseal-sync-android.zip

          unzip -q trueseal-sync-android.zip -d _artifacts

          mkdir -p \
            lib/src/main/jniLibs/arm64-v8a \
            lib/src/main/jniLibs/x86_64 \
            lib/src/main/java/uniffi/trueseal_sync \
            lib/src/main/java/uniffi/trueseal_noise

          cp _artifacts/trueseal-android-staging/jniLibs/arm64-v8a/libtrueseal_sync.so  lib/src/main/jniLibs/arm64-v8a/
          cp _artifacts/trueseal-android-staging/jniLibs/x86_64/libtrueseal_sync.so     lib/src/main/jniLibs/x86_64/
          cp _artifacts/trueseal-android-staging/kotlin/uniffi/trueseal_sync/trueseal_sync.kt   lib/src/main/java/uniffi/trueseal_sync/
          cp _artifacts/trueseal-android-staging/kotlin/uniffi/trueseal_noise/trueseal_noise.kt lib/src/main/java/uniffi/trueseal_noise/

          # Patch generated bindings: fix two known UniFFI codegen issues
          # 1. @Synchronized override fun close() duplicates the Rust-generated close()
          # 2. `val `message`` constructor param shadows `override val message` in exceptions
          python3 - <<'PYEOF'
import re
for path in [
    "lib/src/main/java/uniffi/trueseal_noise/trueseal_noise.kt",
    "lib/src/main/java/uniffi/trueseal_sync/trueseal_sync.kt",
]:
    try:
        txt = open(path).read()
        txt = re.sub(r'\n\s+@Synchronized\n\s+override fun close\(\) \{\n\s+this\.destroy\(\)\n\s+\}', '', txt)
        txt = re.sub(r'val `message`: kotlin\.String', '`message`: kotlin.String', txt)
        open(path, 'w').write(txt)
    except FileNotFoundError:
        pass
PYEOF

      # ── Java / Android SDK ────────────────────────────────────────────────

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Test ──────────────────────────────────────────────────────────────

      - name: Debug Gradle env
        run: |
          echo "GRADLE_OPTS='$GRADLE_OPTS'"
          echo "JAVA_OPTS='$JAVA_OPTS'"
          echo "JAVA_TOOL_OPTIONS='$JAVA_TOOL_OPTIONS'"
          echo "_JAVA_OPTIONS='$_JAVA_OPTIONS'"
          env | grep -iE 'gradle|java' | sort || true

      - name: Run unit tests
        env:
          GRADLE_OPTS: ""
          JAVA_OPTS: ""
        run: ./gradlew :lib:testReleaseUnitTest
