name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Download artifacts & run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── G8 pin guard (KOTLIN-3, #11) ──────────────────────────────────────

      - name: Check workflow pins (no floating inputs)
        run: bash scripts/check-pins.sh

      # ── SDK-3 (#6): no hand-written version/limit literals in SDK sources ──
      - name: Check no literal limits in SDK sources
        run: bash scripts/check-no-literal-limits.sh

      # ── SDK-4 (#7): the G12 parity gate ─────────────────────────────────
      # The canonical `code` strings of this SDK's public sum types vs the
      # vendored, SHA-256-pinned copy of the core's generated shared-facts
      # (see Parity/README.md). --self-test is the negative test G12
      # requires: renamed/missing/extra fixtures must all be caught.
      - name: Verify the vendored shared-facts pin
        env:
          SHARED_FACTS_SHA256: 159491b8a563c6928d564458c898e2c5e815e3e291091bc7e6342624031fe62a
        run: |
          ACTUAL=$(shasum -a 256 Parity/shared-facts.json | awk '{print $1}')
          [ "$ACTUAL" = "$SHARED_FACTS_SHA256" ]             || { echo "::error::Parity/shared-facts.json drifted from its pin (see Parity/README.md)"; exit 1; }

      - name: G12 parity check (+ negative self-test)
        run: |
          python3 scripts/check-parity.py --report "${{ runner.temp }}/trueseal-g12-parity-report.json"
          python3 scripts/check-parity.py --self-test

      - name: Upload G12 parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trueseal-g12-parity-report
          path: ${{ runner.temp }}/trueseal-g12-parity-report.json
          if-no-files-found: warn

      # ── Fetch pre-built .so + Kotlin bindings via the single pinned path ──

      # The pin (exact version + SHA-256) lives in scripts/fetch-core-artifacts.sh;
      # check-pins.sh fails the build on any other fetch path or a floating
      # release reference (KOTLIN-3, #11).
      - name: Download pinned trueseal-sync Android artifacts
        run: bash scripts/fetch-core-artifacts.sh

      # ── Java / Android SDK ────────────────────────────────────────────────

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Test ──────────────────────────────────────────────────────────────

      - name: Run unit tests
        env:
          GRADLE_OPTS: ""
          JAVA_OPTS: ""
        run: ./gradlew :lib:testReleaseUnitTest

  # ── KOTLIN-2 (#10, e2e ADR-0001): the headless JVM lane ──────────────────
  # The SAME sources as :lib, compiled for plain JVM and run against the
  # pinned Linux x64 core. A lane that can't run counts as a failure, so
  # TRUSEAL_JVM_LANE=require turns the local skip into a hard error.
  jvm-lane:
    name: JVM test lane (KOTLIN-2, headless e2e)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check workflow pins (no floating inputs)
        run: bash scripts/check-pins.sh

      - name: Check :jvm-test stays test-only (no publication)
        run: bash scripts/check-jvm-test-only.sh

      - name: Check no literal limits in SDK sources
        run: bash scripts/check-no-literal-limits.sh

      # The UniFFI Kotlin bindings come from the Android zip; the lane loads
      # the pinned Linux x64 .so. Both through the single pinned fetch path.
      - name: Download pinned trueseal-sync Android artifacts (bindings)
        run: bash scripts/fetch-core-artifacts.sh

      - name: Download pinned trueseal-sync Linux x64 core
        run: bash scripts/fetch-core-artifacts.sh --linux

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run the JVM lane (shared unit tests + native + driver protocol)
        env:
          TRUSEAL_JVM_LANE: require
          # SDK-2 (G5): the vector-check report the Release Conductor
          # attaches as Release Evidence.
          TRUSEAL_VECTOR_REPORT: ${{ runner.temp }}/trueseal-g5-vectors-report.json
        run: ./gradlew :jvm-test:test

      # SDK-2 (G5): uploaded even on failure so a red run keeps its record
      # of which section failed (mirrors the Swift precedent, swift#13).
      - name: Upload G5 vector report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trueseal-g5-vectors-report
          path: ${{ runner.temp }}/trueseal-g5-vectors-report.json
          if-no-files-found: warn
