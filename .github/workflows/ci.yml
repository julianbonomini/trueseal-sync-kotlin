name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Download artifacts & run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Fetch pre-built .so + Kotlin bindings from trueseal-sync release ──

      - name: Download trueseal-sync Android artifacts
        env:
          TRUESEAL_READ_TOKEN: ${{ secrets.TRUESEAL_READ_TOKEN }}
        run: |
          RELEASE_JSON=$(curl -sf \
            -H "Authorization: token $TRUESEAL_READ_TOKEN" \
            "https://api.github.com/repos/julianbonomini/trueseal-sync/releases/latest")

          UPSTREAM_VERSION=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          ASSET_URL=$(echo "$RELEASE_JSON" | jq -r \
            '.assets[] | select(.name | (startswith("trueseal-sync-android-") and endswith(".zip"))) | .url')

          echo "Fetching upstream $UPSTREAM_VERSION → $ASSET_URL"
          echo "UPSTREAM_VERSION=$UPSTREAM_VERSION" >> "$GITHUB_ENV"

          curl -sf -L \
            -H "Authorization: token $TRUESEAL_READ_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$ASSET_URL" -o trueseal-sync-android.zip

          unzip -q trueseal-sync-android.zip -d _artifacts

          mkdir -p \
            lib/src/main/jniLibs/arm64-v8a \
            lib/src/main/jniLibs/x86_64 \
            lib/src/main/java/uniffi/trueseal_sync \
            lib/src/main/java/uniffi/trueseal_noise

          cp _artifacts/jniLibs/arm64-v8a/libtrueseal_sync.so  lib/src/main/jniLibs/arm64-v8a/
          cp _artifacts/jniLibs/x86_64/libtrueseal_sync.so     lib/src/main/jniLibs/x86_64/
          cp _artifacts/kotlin/uniffi/trueseal_sync/trueseal_sync.kt   lib/src/main/java/uniffi/trueseal_sync/
          cp _artifacts/kotlin/uniffi/trueseal_noise/trueseal_noise.kt lib/src/main/java/uniffi/trueseal_noise/

      # ── Java / Android SDK ────────────────────────────────────────────────

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── Test ──────────────────────────────────────────────────────────────

      - name: Run unit tests
        run: ./gradlew :lib:testReleaseUnitTest
