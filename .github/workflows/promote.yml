name: Promote

# SDK-4 / e2e ADR-0002: promotion publishes the EXACT bytes the candidate
# (release.yml) staged and the gate tested — the same draft, published, no
# rebuild. The immutable tag v<version> materialises ONLY here, when the
# draft is published (a draft release has a target commit but no tag ref on
# origin); tags are never moved (sync ADR-0030), so a bad release is a new
# patch version.
#
# Idempotent (ADR-0002 "Failures": a failed promotion is retried forward):
# if v<version> is already published this is a no-op success.
#
# The Release Conductor (trueseal-e2e) dispatches this after a green gate;
# a maintainer can do the same by hand:
#   gh workflow run promote.yml -f version=0.6.0
#
# D15 SEAM (KOTLIN-1, Maven Central): the signed Central bundle upload
# happens HERE, at promotion (issue #7: "uploaded to Central only at
# promotion"), once D15 lands with the GPG key (maintainer item A3). The
# marked step below is the seam; until then promotion publishes the GitHub
# Release only, and Central remains a documented gap of the preview.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Lockstep version to promote, e.g. 0.6.0 (no leading v)"
        required: true
        type: string

concurrency:
  group: promote-kotlin-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote:
    name: verify staged bytes + publish
    runs-on: ubuntu-latest

    steps:
      - name: Validate the version input
        run: |
          echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "FAIL: version must be X.Y.Z without a leading v"; exit 1; }

      - name: Resolve the staged release
        id: staged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          if ! gh release view "$TAG" --json isDraft,targetCommitish > /tmp/staged.json 2>/dev/null; then
            echo "FAIL: no release $TAG — run the candidate build (release.yml) for ${{ inputs.version }} first" >&2
            exit 1
          fi
          IS_DRAFT=$(jq -r .isDraft /tmp/staged.json)
          TARGET=$(jq -r .targetCommitish /tmp/staged.json)
          echo "is_draft=$IS_DRAFT" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "staged: draft=$IS_DRAFT target=$TARGET"

      # ADR-0002: a re-run on an already-live channel has nothing to do.
      - name: Already published — idempotent no-op
        if: steps.staged.outputs.is_draft == 'false'
        run: echo "v${{ inputs.version }} is already published; nothing to do"

      # Tags are immutable (ADR-0030). If the tag exists while the release
      # is still a draft, someone created it out of band — never overwrite
      # or move it; stop and let a human untangle.
      - name: Refuse to touch an existing tag
        if: steps.staged.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          if gh api "repos/${{ github.repository }}/git/refs/tags/$TAG" >/dev/null 2>&1; then
            echo "FAIL: tag $TAG already exists on origin but the release is still a draft — tags are never moved; investigate by hand" >&2
            exit 1
          fi

      # G8/G9 hard gate on the bytes being promoted: recompute the staged
      # AAR's checksum and require it to equal the checksum asset staged
      # alongside it by the candidate. If the gate tested these bytes,
      # publishing them is safe; anything else fails here.
      - name: Verify the staged bytes
        if: steps.staged.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          TAG="v$VERSION"
          AAR="trueseal-sync-kotlin-$VERSION.aar"
          gh release download "$TAG" --pattern "$AAR" --output "/tmp/$AAR" --clobber
          gh release download "$TAG" --pattern "$AAR.sha256" --output "/tmp/$AAR.sha256" --clobber
          RECOMPUTED=$(shasum -a 256 "/tmp/$AAR" | awk '{print $1}')
          STAGED=$(awk '{print $1}' "/tmp/$AAR.sha256")
          [ -n "$STAGED" ] || { echo "FAIL: staged checksum asset is empty" >&2; exit 1; }
          [ "$RECOMPUTED" = "$STAGED" ] \
            || { echo "FAIL: staged AAR ($RECOMPUTED) != staged checksum ($STAGED) — refusing to publish bytes the candidate did not name" >&2; exit 1; }
          echo "OK: staged bytes verified ($STAGED)"

      # Release notes: the one lockstep changelog lives in trueseal-sync
      # with a section per SDK (e2e ADR-0002 "Release notes"); every GitHub
      # Release in the group links to it.
      - name: Publish the staged bytes (materialises the immutable tag)
        if: steps.staged.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          TAG="v$VERSION"
          AAR="trueseal-sync-kotlin-$VERSION.aar"
          STAGED=$(awk '{print $1}' "/tmp/$AAR.sha256")
          cat > /tmp/release-notes.md <<EOF
          TrueSeal $VERSION — Kotlin SDK (lockstep release).

          Changelog: the TrueSeal $VERSION section of the [one lockstep changelog](https://github.com/julianbonomini/trueseal-sync/blob/main/CHANGELOG.md), subsection **trueseal-sync-kotlin** (e2e ADR-0002: one changelog per TrueSeal Release, linked from every release in the group; breaking releases carry upgrade steps there).

          This is a Developer Preview: any 0.x release may break the API, the wire format or stored data without notice (ADR-0033).

          - core: checksum-pinned at candidate time (scripts/fetch-core-artifacts.sh)
          - $AAR sha256: \`$STAGED\`
          - Maven Central (\`dev.trueseal:trueseal-sync\`): lands with KOTLIN-1 — the signed-bundle upload seam is in promote.yml.
          EOF
          gh release edit "$TAG" \
            --title "TrueSeal $VERSION" \
            --notes-file /tmp/release-notes.md \
            --draft=false \
            --prerelease=false
          echo "published $TAG"

      # D15 SEAM: upload the signed Maven bundle to Central here (the GPG
      # key stays a secret of this repo only — issue #7).

      - name: Confirm the tag is live on the candidate commit
        if: steps.staged.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          git ls-remote --tags origin "$TAG" | grep -q "$TAG" \
            || { echo "FAIL: tag $TAG not on origin after publish" >&2; exit 1; }
          gh release view "$TAG" --json isDraft --jq .isDraft | grep -q false \
            || { echo "FAIL: release still a draft after publish" >&2; exit 1; }
          echo "OK: $TAG published; tag on origin at ${{ steps.staged.outputs.target }}"
