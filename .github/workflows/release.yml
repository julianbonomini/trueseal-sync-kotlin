name: Release AAR

# Triggered by a version tag, e.g.: git tag v0.4.1 && git push origin v0.4.1
on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish AAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so we can move the tag after committing artifacts
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── G8 pin guard (KOTLIN-3, #11) ──────────────────────────────────────

      - name: Check workflow pins (no floating inputs)
        run: bash scripts/check-pins.sh

      # ── Fetch pre-built .so + Kotlin bindings via the single pinned path ──

      # The pin (exact version + SHA-256) lives in scripts/fetch-core-artifacts.sh;
      # the old floating latest-release lookup and the expired TRUESEAL_READ_TOKEN
      # dependency are gone (KOTLIN-3, #11). UPSTREAM_VERSION is exported by
      # the script for the release notes below.
      - name: Download pinned trueseal-sync Android artifacts
        run: bash scripts/fetch-core-artifacts.sh

      # ── Java / Android SDK ────────────────────────────────────────────────

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Assemble AAR ──────────────────────────────────────────────────────

      - name: Set VERSION_NAME from tag
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Assemble release AAR
        run: ./gradlew :lib:assembleRelease -PVERSION_NAME="$VERSION_NAME"

      # ── Commit artifacts so JitPack can build the AAR from this tag ───────
      # JitPack builds from the tagged commit; .so + bindings must be present.
      # We force-add (bypassing .gitignore), commit, then move the tag here.

      - name: Commit native libs + UniFFI bindings
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Force-add so .gitignore exclusions don't block us
          git add --force \
            lib/src/main/jniLibs/arm64-v8a/libtrueseal_sync.so \
            lib/src/main/jniLibs/x86_64/libtrueseal_sync.so \
            lib/src/main/java/uniffi/trueseal_sync/trueseal_sync.kt \
            lib/src/main/java/uniffi/trueseal_noise/trueseal_noise.kt

          git diff --cached --quiet && {
            echo "No artifact changes — skipping commit."
          } || {
            git commit -m "chore: native libs + UniFFI bindings for ${GITHUB_REF_NAME} (upstream trueseal-sync ${UPSTREAM_VERSION}) [skip ci]"
            # Move the tag to the new commit so JitPack sees the artifacts
            git tag -f "${GITHUB_REF_NAME}"
            git push origin HEAD:main
            git push origin "${GITHUB_REF_NAME}" --force
          }

      # ── GitHub Release ────────────────────────────────────────────────────

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: lib/build/outputs/aar/lib-release.aar
          fail_on_unmatched_files: true
          body: |
            ## trueseal-sync-kotlin ${{ github.ref_name }}

            Built against **trueseal-sync ${{ env.UPSTREAM_VERSION }}**.

            ### JitPack
            ```gradle
            implementation("com.github.julianbonomini:trueseal-sync-kotlin:${{ github.ref_name }}")
            ```
